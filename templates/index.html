<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | SmartAttendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0b0f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: #15151c;
            border: 1px solid #292934;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 30px;
        }

        .logo span {
            color: #ff3b30;
        }

        .logo p {
            color: #888;
            margin-top: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0f0f14;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff3b30;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff3b30;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            background: rgba(255, 59, 48, 0.12);
            border: 1px solid rgba(255, 59, 48, 0.4);
            color: #ff6b63;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>Smart<span>Attendance</span></h1>
        <p>Teacher Portal</p>
    </div>

    <h2>👩‍🏫 Teacher Login</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="input-group">
            <label for="email">Teacher Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter teacher email"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="footer">
        SmartAttendance Teacher Portal
    </div>

</div>

</body>
</html>
